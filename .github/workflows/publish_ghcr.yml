name: Publish QA Runtime Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - 'requirements.txt'
      - '.github/workflows/publish_ghcr.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      force_push:
        description: '是否强制重新构建并推送到 GHCR'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: 检出工程代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像元数据与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qa-runtime
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: 构建并推送统一运行时镜像到 GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
